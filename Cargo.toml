[package]
name = "sts-engine"
version = "0.1.0"
edition = "2021"
description = "High-performance, graphics-free Slay the Spire engine for AI training research"
license = "MIT"
publish = false

[lib]
name = "sts_engine"
path = "src/lib.rs"

[[bin]]
name = "sts-replay"
path = "src/bin/replay.rs"

[[bin]]
name = "sts-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "sts-htn"
path = "src/bin/htn.rs"

[[bin]]
name = "sts-parity"
path = "src/bin/parity.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
