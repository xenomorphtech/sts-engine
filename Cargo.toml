[package]
name = "sts-engine"
version = "0.1.0"
edition = "2021"
description = "High-performance, graphics-free Slay the Spire engine for AI training research"
license = "MIT"
publish = false

[lib]
name = "sts_engine"
path = "src/lib.rs"

[[bin]]
name = "sts-replay"
path = "src/bin/replay.rs"

[[bin]]
name = "sts-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "sts-htn"
path = "src/bin/htn.rs"

[[bin]]
name = "sts-parity"
path = "src/bin/parity.rs"

[[bin]]
name = "sts-htn-rpc"
path = "src/bin/htn_rpc.rs"

[[bin]]
name = "sts-combat-trace"
path = "src/bin/combat_trace.rs"

[[bin]]
name = "sts-hrm-train"
path = "src/bin/hrm_train.rs"

[[bin]]
name = "sts-hrm-eval"
path = "src/bin/hrm_eval.rs"

[[bin]]
name = "sts-selfplay"
path = "src/bin/selfplay.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tiny_http = "0.12"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "cuda", "api-27"] }
rayon = "1.11"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
